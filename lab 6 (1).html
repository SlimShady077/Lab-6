<!DOCTYPE html>
<html>
<head>
    <title>Question 1</title>
</head>
<body>

<h2>Number Checker</h2>
<p id="result"></p>

<script>
let number = -8;

if (number > 0) {
    document.getElementById("result").innerHTML =
        number + " is a positive number.";
} else if (number < 0) {
    document.getElementById("result").innerHTML =
        number + " is a negative number.";
} else {
    document.getElementById("result").innerHTML =
        number + " is zero.";
}
</script>

</body>
</html>
