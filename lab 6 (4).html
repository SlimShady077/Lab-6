<!DOCTYPE html>
<html>
<head>
    <title>Question 4</title>
</head>
<body>

<h2>Bookstore Discount</h2>
<p id="result"></p>

<script>
let purchase = 250;
let discount = 0;

if (purchase >= 200) {
    discount = 20;
} else if (purchase >= 100) {
    discount = 10;
}

let finalPayment = purchase - (purchase * discount / 100);

document.getElementById("result").innerHTML =
    "Purchase Amount: RM" + purchase + "<br>" +
    "Discount: " + discount + "%<br>" +
    "Final Payment: RM" + finalPayment;
</script>

</body>
</html>
