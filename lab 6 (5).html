<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Checker</title>
</head>
<body>

<h1>Student Grade Checker</h1>

<label>Student Name:</label>
<input type="text" id="name"><br><br>

<label>Examination Mark:</label>
<input type="number" id="mark"><br><br>

<button onclick="checkGrade()">Check Grade</button>

<p id="result"></p>

<script>
function checkGrade() {
    let name = document.getElementById("name").value;
    let mark = Number(document.getElementById("mark").value);
    let grade;

    if (mark < 0 || mark > 100) {
        document.getElementById("result").innerHTML =
            "Invalid mark. Please enter a value between 0 and 100.";
        return;
    }

    if (mark >= 80) {
        grade = "A";
    } else if (mark >= 70) {
        grade = "B";
    } else if (mark >= 60) {
        grade = "C";
    } else if (mark >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    document.getElementById("result").innerHTML =
        "Student Name: " + name + "<br>" +
        "Examination Mark: " + mark + "<br>" +
        "Grade: " + grade;
}
</script>

</body>
</html>
