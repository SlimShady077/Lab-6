<!DOCTYPE html>
<html>
<head>
    <title>Question 3</title>
</head>
<body>

<h2>Student Grade</h2>
<p id="result"></p>

<script>
let mark = 85;
let grade;

if (mark >= 80) {
    grade = "A";
} else if (mark >= 70) {
    grade = "B";
} else if (mark >= 60) {
    grade = "C";
} else if (mark >= 50) {
    grade = "D";
} else {
    grade = "F";
}

document.getElementById("result").innerHTML =
    "Mark: " + mark + "<br>Grade: " + grade;
</script>

</body>
</html>
